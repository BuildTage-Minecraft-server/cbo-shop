name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check server environment file
        run: test -f ~/cbo-shop/.env || { echo "Create ~/cbo-shop/.env first"; exit 1; }

      - name: Build image
        run: docker build -t cbo-shop:latest .

      - name: Start services
        run: |
          cp docker-compose.yml ~/cbo-shop/docker-compose.yml
          cd ~/cbo-shop
          docker compose up -d --remove-orphans --wait --wait-timeout 120

      - name: Clean up
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter until=72h
